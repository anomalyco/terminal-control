name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: node --test scripts/portable-zig.test.mjs
      - run: scripts/build-portable.sh
      - name: Verify x86-64 baseline CPU compatibility
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          printf 'portable-terminal' | qemu-x86_64 -cpu qemu64 target/release/termctrl show --input - | grep -Fx portable-terminal
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/test typecheck
      - run: TERMCTRL_TEST_BINARY="$PWD/target/release/termctrl" bun test packages/test/src/index.test.ts
      - run: bun run --cwd packages/opentui typecheck
      - run: bun run --cwd packages/opentui test
      - run: bun run validate:opentui
      - run: bun run validate:npm "$PWD/target/release/termctrl"
      - run: cargo package
