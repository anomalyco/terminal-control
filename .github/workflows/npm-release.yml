name: npm release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the assembled npm packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.package }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            package: darwin-arm64
          - runner: macos-15-intel
            package: darwin-x64
          - runner: ubuntu-24.04-arm
            package: linux-arm64-gnu
          - runner: ubuntu-24.04
            package: linux-x64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/portable-zig.test.mjs
      - run: scripts/build-portable.sh
      - name: Verify x86-64 baseline CPU compatibility
        if: matrix.package == 'linux-x64-gnu'
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          printf 'portable-terminal' | qemu-x86_64 -cpu qemu64 target/release/termctrl show --input - | grep -Fx portable-terminal
      - run: node scripts/native-packages.mjs "${{ matrix.package }}" "$PWD/target/release/termctrl" "$PWD/npm-artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.package }}
          path: npm-artifacts/*.tgz

  client:
    name: TypeScript client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/test typecheck
      - run: mkdir -p npm-artifacts && npm pack ./packages/test --pack-destination npm-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-test
          path: npm-artifacts/*.tgz

  opentui:
    name: OpenTUI adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/opentui typecheck
      - run: bun run --cwd packages/opentui test
      - run: mkdir -p npm-artifacts && npm pack ./packages/opentui --pack-destination npm-artifacts
      - run: node scripts/validate-opentui-package.mjs npm-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-opentui
          path: npm-artifacts/*.tgz

  validate:
    name: Validate publishable install
    needs: [native, client, opentui]
    strategy:
      matrix:
        include:
          - runner: macos-15
            package: darwin-arm64
          - runner: macos-15-intel
            package: darwin-x64
          - runner: ubuntu-24.04-arm
            package: linux-arm64-gnu
          - runner: ubuntu-24.04
            package: linux-x64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: true
      - run: node scripts/publish-npm-tarballs.mjs npm-artifacts --check
      - run: node scripts/validate-npm-packages.mjs --tarballs npm-artifacts "${{ matrix.package }}"

  publish:
    name: Publish npm packages
    if: ${{ inputs.publish }}
    needs: [native, client, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: true
      - run: node scripts/release-packages.mjs
